name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform CLI: path handling and encodings differ between these.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors so the build stays warning-free.
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  # Single, stable status check for branch protection, independent of the matrix.
  ci:
    name: ci
    if: always()
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Require all build-test jobs to pass
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test result: ${{ needs.build-test.result }}"
            exit 1
          fi
